<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite Gym</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f0f0f;
  color: white;
}

/* NAVBAR */
nav {
  display: flex;
  justify-content: space-between;
  padding: 15px 30px;
  background: black;
  position: sticky;
  top: 0;
}

nav h2 { color: #00ff88; }

/* HERO */
.hero {
  height: 90vh;
  background: url('images/gym-bg.jpg') center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.hero h1 {
  font-size: 50px;
  background: rgba(0,0,0,0.6);
  padding: 20px;
  border-radius: 10px;
}

/* SECTION */
.section {
  padding: 50px 20px;
  text-align: center;
}

.section h2 {
  margin-bottom: 30px;
  color: #00ff88;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
}

/* CARD */
.card {
  background: #1c1c1c;
  border-radius: 12px;
  overflow: hidden;
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-5px);
}

.card img {
  width: 100%;
  height: 220px;
  object-fit: cover;
}

.info {
  padding: 15px;
}

.price {
  color: #00ff88;
  font-weight: bold;
}

/* GALLERY */
.gallery img {
  width: 100%;
  border-radius: 10px;
}

/* CONTACT */
.contact {
  background: black;
  padding: 40px;
}

/* WHATSAPP */
.whatsapp {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #25D366;
  padding: 15px;
  border-radius: 50%;
  text-decoration: none;
  color: white;
  font-size: 20px;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav>
  <h2>Elite Gym</h2>
  <p>Transform Yourself</p>
</nav>

<!-- HERO -->
<div class="hero">
  <h1>Build Your Dream Body</h1>
</div>

<!-- ABOUT -->
<div class="section">
  <h2>About Us</h2>
  <p>We provide world-class gym equipment and training environment to help you achieve your fitness goals.</p>
</div>

<!-- PRODUCTS -->
<div class="section">
  <h2>Our Equipment</h2>
  <div class="grid">

    <div class="card">
      <img src="images/product1.jpg">
      <div class="info">
        <h3>Dumbbells Set</h3>
        <p class="price">₹2,999</p>
      </div>
    </div>

    <div class="card">
      <img src="images/product2.jpg">
      <div class="info">
        <h3>Bench Press</h3>
        <p class="price">₹5,999</p>
      </div>
    </div>

    <div class="card">
      <img src="images/product3.jpg">
      <div class="info">
        <h3>Treadmill</h3>
        <p class="price">₹25,000</p>
      </div>
    </div>

  </div>
</div>

<!-- GALLERY -->
<div class="section">
  <h2>Gallery</h2>
  <div class="grid gallery">
    <img src="images/gym1.jpg">
    <img src="images/gym2.jpg">
    <img src="images/gym3.jpg">
  </div>
</div>

<!-- CONTACT -->
<div class="contact">
  <h2>Contact Us</h2>
  <p>📍 Your City</p>
  <p>📞 +91 9876543210</p>
</div>

<!-- WHATSAPP -->
<a href="https://wa.me/919876543210" class="whatsapp">💬</a>

</body>
</html>
